project_id = "mongolz-next"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
# Хүсээгүй person-аар signup хийгдэхгүй (`auth.admin.createUser` л үүсгэнэ).
# Note: email signin-ыг enable байх тулд `[auth.email] enable_signup = true` хадгална.
enable_signup = false

[auth.email]
# Email provider-ийг enable байлгана (CLI бичлэг false бол signin ч disable болдог)
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "100MiB"
