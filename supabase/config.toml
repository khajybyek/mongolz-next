project_id = "mongolz-next"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback"]
jwt_expiry = 3600
# Хүсээгүй person-аар signup хийгдэхгүй (`auth.admin.createUser` л үүсгэнэ).
# Note: email signin-ыг enable байх тулд `[auth.email] enable_signup = true` хадгална.
enable_signup = false

[auth.email]
# Keep the email/password provider available for existing accounts. New
# accounts are still blocked globally by auth.enable_signup=false and are
# provisioned with the service-role admin API.
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = true  # pragma: allowlist secret

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[storage]
enabled = true
file_size_limit = "100MiB"

[functions.telegram-alerts]
verify_jwt = true

[functions.claude-analysis]
verify_jwt = true
