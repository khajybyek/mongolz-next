name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-build:
    name: Lint & Build (Next.js)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Migration safety lint
        run: npm run lint:migrations

      # Same command as local `npm run typecheck`: `next typegen` first so
      # typedRoutes errors are caught here, not only by `next build`.
      - name: Type check
        run: npm run typecheck
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_ML_SERVICE_URL: https://placeholder.example.com

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder
          NEXT_PUBLIC_ML_SERVICE_URL: https://placeholder.example.com

  test-frontend:
    name: Test (Jest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-build
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Run tests
        run: npx jest --ci
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder

  # Plain-SQL assertions (supabase/tests/*.test.sql) against a real Postgres
  # with every migration applied: the security functions, lease RPCs and
  # search paging that Jest only covers through JavaScript mirrors. Local:
  # `npm run test:sql`.
  test-sql:
    name: SQL tests (Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359 # v3.0.1
        with:
          # Same CLI the SQL tests were written against locally.
          version: 2.95.4

      - name: Start local database (applies every migration)
        run: supabase db start

      - name: Run SQL tests
        run: bash scripts/test-sql.sh

  test-ml:
    name: Test (Pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ml-service/requirements.txt

      - name: Install dependencies
        working-directory: ml-service
        run: |
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      # The capture-integrity tests encode and decode real segments with the
      # service's FFmpeg dependency; without it they fail rather than skip,
      # so the runner gets the same binary the Docker image ships.
      - name: Install FFmpeg
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Run tests
        working-directory: ml-service
        run: pytest -v --tb=short
        env:
          SUPABASE_URL: https://placeholder.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: placeholder
          ML_SERVICE_TOKEN: test-token
          ML_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
          HLS_DIR: /tmp/mongolz-hls

      - name: Run edge-agent durability tests
        run: pytest -v --tb=short edge-agent/tests
