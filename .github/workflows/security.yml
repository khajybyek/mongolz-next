name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm audit --omit=dev || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pip audit
        run: |
          pip install pip-audit
          pip-audit -r ml-service/requirements.txt || true
