name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: # manual one-shot trigger (for baseline scans)

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm audit --omit=dev || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pip audit
        run: |
          pip install pip-audit
          pip-audit -r ml-service/requirements.txt || true

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      # Run Semgrep with audited security rulesets covering TS, JS, Python:
      # - p/owasp-top-ten         OWASP A01-A10
      # - p/security-audit        broad CWE catch-all
      # - p/typescript            TS-specific anti-patterns
      # - p/react                 React XSS / hooks misuse
      # - p/nextjs                Next.js auth + route patterns
      # - p/python                general Python issues
      # Exit non-zero on findings so PRs surface them.
      - run: semgrep ci
        env:
          SEMGREP_RULES: >-
            p/owasp-top-ten
            p/security-audit
            p/typescript
            p/react
            p/nextjs
            p/python
          # No SEMGREP_APP_TOKEN — local rules only (no Semgrep Cloud).
          # Fail-on configures severity threshold; ERROR fails the build.
          SEMGREP_FAIL_ON: ERROR

  secrets-scan:
    name: Secret scanning (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Push-to-main runs would have base==head and the action errors out;
    # PR-only is the standard pattern. Weekly scheduled run still covers
    # the full history.
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: trufflesecurity/trufflehog@main
        with:
          path: .
          extra_args: --only-verified --no-update

  # ─── DAST (dynamic application security testing) ──────────────────────
  # These probe the LIVE production URL. To keep WAF noise low and avoid
  # CI minute burn we only run on the weekly schedule + manual dispatch.

  nuclei:
    name: DAST (Nuclei)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: Run Nuclei
        uses: projectdiscovery/nuclei-action@main
        with:
          target: https://mongolz.vercel.app
          # `templates: cves,vulnerabilities,misconfiguration,exposures` are the
          # high-signal categories; `default-logins` and `panels` flag exposed
          # admin endpoints.
          flags: >-
            -severity critical,high,medium
            -rate-limit 50
            -timeout 10
            -markdown-export nuclei-report.md
            -no-color
            -silent

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuclei-report
          path: nuclei-report.md
          if-no-files-found: ignore

  zap:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      # `permissions:` is a full override, so we must restate the default
      # `contents: read` token that `actions/checkout` needs.
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@v0.13.0
        with:
          target: https://mongolz.vercel.app
          cmd_options: "-a -j"
          # -a   include alpha-quality passive rules
          # -j   use the AJAX spider for JS-heavy routes
          fail_action: false
          allow_issue_writing: true
          artifact_name: zap-baseline-report
