name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm audit --omit=dev || true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pip audit
        run: |
          pip install pip-audit
          pip-audit -r ml-service/requirements.txt || true

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: semgrep/semgrep:latest
    steps:
      - uses: actions/checkout@v4

      # Run Semgrep with audited security rulesets covering TS, JS, Python:
      # - p/owasp-top-ten         OWASP A01-A10
      # - p/security-audit        broad CWE catch-all
      # - p/typescript            TS-specific anti-patterns
      # - p/react                 React XSS / hooks misuse
      # - p/nextjs                Next.js auth + route patterns
      # - p/python                general Python issues
      # Exit non-zero on findings so PRs surface them.
      - run: semgrep ci
        env:
          SEMGREP_RULES: >-
            p/owasp-top-ten
            p/security-audit
            p/typescript
            p/react
            p/nextjs
            p/python
          # No SEMGREP_APP_TOKEN — local rules only (no Semgrep Cloud).
          # Fail-on configures severity threshold; ERROR fails the build.
          SEMGREP_FAIL_ON: ERROR

  secrets-scan:
    name: Secret scanning (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Push-to-main runs would have base==head and the action errors out;
    # PR-only is the standard pattern. Weekly scheduled run still covers
    # the full history.
    if: github.event_name == 'pull_request' || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: trufflesecurity/trufflehog@main
        with:
          path: .
          extra_args: --only-verified --no-update
