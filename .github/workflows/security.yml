name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch: # manual one-shot trigger (for baseline scans)

# Least privilege by default; jobs that need more restate it.
permissions:
  contents: read

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: npm

      # Fails on HIGH/CRITICAL in production dependencies — a red badge is
      # the whole point; `|| true` made this job decorative.
      - run: npm audit --omit=dev --audit-level=high

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"

      - name: Pip audit
        run: |
          pip install pip-audit
          pip-audit -r ml-service/requirements.txt

  sast:
    name: SAST (Semgrep)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: semgrep/semgrep:1.99.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # Run Semgrep with audited security rulesets covering TS, JS, Python.
      # Exit non-zero on ERROR-severity findings so PRs surface them.
      - run: semgrep ci
        env:
          SEMGREP_RULES: >-
            p/owasp-top-ten
            p/security-audit
            p/typescript
            p/react
            p/nextjs
            p/python
          SEMGREP_FAIL_ON: ERROR

  secrets-scan:
    name: Secret scanning (trufflehog)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      # Runs on direct pushes too (this repo commits straight to main): scan
      # the pushed range rather than the whole history each time.
      - uses: trufflesecurity/trufflehog@ddc015e5ed99942b2253d8ea16a0586a01ef2ab1 # v3.88.0
        with:
          path: .
          base: ${{ github.event_name == 'push' && github.event.before || '' }}
          head: ${{ github.event_name == 'push' && github.sha || '' }}
          # The action already passes --no-update; repeating it makes
          # trufflehog exit 1 with "flag 'no-update' cannot be repeated".
          extra_args: --only-verified

  # ─── DAST (dynamic application security testing) ──────────────────────
  # These probe the LIVE production URL. To keep WAF noise low and avoid
  # CI minute burn we only run on the weekly schedule + manual dispatch.

  nuclei:
    name: DAST (Nuclei)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Run Nuclei
        uses: projectdiscovery/nuclei-action@32a91c0da7be14c07b0ade6c14fa0f6e78d97c9c # v3.1.0
        with:
          # v3 takes ONE `args` string; the v2 inputs `target` / `flags` are
          # silently ignored, which left this job scanning nothing.
          args: >-
            -target https://aicctv.dev
            -severity critical,high,medium
            -rate-limit 50
            -timeout 10
            -markdown-export nuclei-report.md
            -no-color
            -silent

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nuclei-report
          path: nuclei-report.md
          if-no-files-found: ignore

  zap:
    name: DAST (OWASP ZAP baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: ZAP baseline scan
        # v0.13 uploaded its report through the retired artifact v1 API
        # ("artifact name … is not valid") and failed the job after the scan.
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        with:
          target: https://aicctv.dev
          # Hand-triaged informational / false-positive rules, each with its reason.
          rules_file_name: .zap/rules.tsv
          cmd_options: "-a -j"
          fail_action: false
          allow_issue_writing: true
          artifact_name: zap-baseline-report
